<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>T-Launcher</title>
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
/*
  Layout after the "Tesla Dashboard UI Component Library" by Nami (Figma Community, CC BY 4.0):
  two views over a black control bar.
    Inicio: car on a studio floor with reflection, callouts, Music + Navigate cards.
    Mapa:   left panel (gear, tell-tales, car from above, music) + live map.
  White by day, black by night / with headlights.
*/
@font-face { font-family: Inter; font-weight: 300; src: url(fonts/inter-latin-300-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); }
:root {
  --stage-top: #fafafa;     /* studio wall */
  --stage-floor: #e3e3e3;   /* studio floor */
  --panel: #fafafa;
  --card: #fafafa;
  --fg: #171717;
  --muted: #757575;
  --inactive: #a2a3a5;
  --outline: #d0d1d2;
  --ok: #19b34a;            /* tell-tale green */
  --bad: #e5322c;
  --warn: #e08a00;
  --accent: #3e6ae1;
  --shadow: 5px -3px 30px 20px rgba(117,117,117,.10), -2px -2px 20px 8px rgba(117,117,117,.08), 1px 1px 12px 2px rgba(65,65,65,.07);
  --reflect: .22;
  --barbg: #fafafa;
  --road: #e6e7e9;
  --lane: #ffffff;
  --dbg: #eceef1;
  --mcard: rgba(250,250,250,.92);
  --font: Inter, "Roboto", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  --stage-top: #414141;
  --stage-floor: #0d0d0d;
  --panel: #1e1e1e;
  --card: #414141;
  --fg: #ffffff;
  --muted: #a2a3a5;
  --inactive: #757575;
  --outline: #5a5a5a;
  --shadow: 0 4px 24px rgba(0,0,0,.45);
  --reflect: .30;
  --barbg: linear-gradient(180deg, #161616, #000);
  --road: #262626;
  --lane: #8a8a8a;
  --dbg: #000000;
  --mcard: rgba(40,40,42,.92);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: #000; color: var(--fg); font-family: var(--font); overflow: hidden; user-select: none; -webkit-user-select: none; }
svg { display: block; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.app { height: 100%; display: grid; grid-template-rows: 1fr 66px; }
.screen { position: relative; overflow: hidden; min-height: 0; }
.view { position: absolute; inset: 0; transition: opacity .35s; }
.view.off { opacity: 0; pointer-events: none; }

/* ---------- shared bits ---------- */
.gear { display: flex; gap: 5px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--inactive); }
.gear b { color: var(--fg); font-weight: 600; }
.tells { display: flex; flex-direction: column; gap: 6px; }
.tell svg { width: 26px; height: 26px; }
.tell.lamp svg { fill: var(--inactive); stroke: var(--inactive); }
.lights-on .tell.lamp svg { fill: var(--ok); stroke: var(--ok); }
.ic { width: 22px; height: 22px; fill: var(--fg); }
.card { background: var(--card); border-radius: 6px; box-shadow: var(--shadow); }
.music { display: grid; grid-template-rows: 54px 2px 46px; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
.music .top { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 12px; padding-right: 12px; }
.music .art { width: 54px; height: 54px; background: #c9c9c9 center/cover no-repeat; display: grid; place-items: center; }
.music .art svg { width: 24px; height: 24px; fill: #fff; }
.music .art.has svg { display: none; }
.music .meta { min-width: 0; }
.music .title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music .artist { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.music .artist svg { width: 11px; height: 11px; fill: var(--muted); flex: none; }
.music .src { font-size: 11px; color: var(--muted); }
.music .bar { background: var(--outline); position: relative; }
.music .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); width: 0; }
.music .bar i::after { content: ""; position: absolute; right: -3px; top: -2px; width: 6px; height: 6px; border-radius: 3px; background: var(--fg); }
.music .ctl { display: flex; align-items: center; min-width: 0; }
.music .ctl button { flex: 1 1 0; min-width: 0; height: 46px; display: grid; place-items: center; }
.music .ctl button:active { background: var(--outline); }
.music .ctl svg { width: 22px; height: 22px; fill: var(--fg); }
.music .ctl .dim svg { fill: var(--inactive); }
.nav { display: grid; grid-template-rows: 54px 1px 46px; overflow: hidden; }
.nav .search { display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; font-weight: 500; color: var(--muted); }
.nav .search svg { width: 18px; height: 18px; fill: var(--muted); }
.nav hr { margin: 0; border: 0; background: var(--outline); height: 1px; }
.nav .places { display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center; }
.nav .places i { height: 26px; background: var(--outline); }
.nav .places button { height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.nav .places svg { width: 17px; height: 17px; fill: var(--muted); }
.nav button:active, .nav .search:active { background: var(--outline); }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 5px; height: 5px; border-radius: 3px; background: var(--inactive); }
.dots i.on { background: var(--fg); }
.toast { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); z-index: 900; background: var(--fg); color: var(--panel);
  font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 16px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: .92; }

/* ---------- Inicio (studio) ---------- */
#home { background: linear-gradient(180deg, var(--stage-top) 0%, var(--stage-top) 52%, var(--stage-floor) 100%); transition: background .5s; }
.statusbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 18px; z-index: 5; }
.statusbar .left { display: flex; align-items: center; gap: 12px; }
.statusbar .dot { width: 3px; height: 3px; border-radius: 2px; background: var(--muted); }
.statusbar .fuel { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; }
.statusbar .fuel svg { width: 14px; height: 14px; fill: var(--fg); }
.statusbar .mid { display: flex; align-items: center; gap: 22px; font-size: 16px; font-weight: 500; color: var(--muted); }
.statusbar .mid button { display: flex; align-items: center; gap: 8px; }
.statusbar .mid svg { width: 22px; height: 22px; fill: var(--muted); }
.statusbar .right { display: flex; align-items: center; justify-content: flex-end; gap: 18px; font-size: 17px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { font-size: 9px; font-weight: 600; line-height: 1.1; color: #fff; background: var(--bad); border-radius: 4px; padding: 4px 7px; text-align: center; letter-spacing: .03em; }
#home .tells { position: absolute; left: 14px; top: 48px; z-index: 5; }
.stage { position: absolute; left: 50%; top: 50%; width: min(54%, 520px); transform: translate(-50%, -50%); aspect-ratio: 728 / 403; }
.stage img, .stage svg.generic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .6s; }
.stage .lit { opacity: 0; }
.lights-on .stage .lit.has { opacity: 1; }
.lights-on .stage .base.swap { opacity: 0; }
.mirror { position: absolute; left: 0; right: 0; top: 96%; height: 70%; transform: scaleY(-1); opacity: var(--reflect); pointer-events: none;
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent 55%); mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent 55%); }
.mirror img, .mirror svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.callout { position: absolute; display: flex; flex-direction: column; align-items: flex-start; font-size: 11px; color: var(--muted); }
.callout b { font-size: 13px; font-weight: 600; color: var(--fg); }
.callout::before { content: ""; position: absolute; left: -7px; top: 2px; width: 1px; height: var(--line, 60px); background: var(--muted); }
.callout.hood { left: 6%; top: 16%; --line: 64px; }
.callout.trunk { left: 96%; top: 0%; --line: 56px; }
.lockpin { position: absolute; left: 47%; top: -9%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.lockpin svg { width: 26px; height: 26px; fill: var(--fg); }
.lockpin i { width: 1px; height: 34px; background: var(--muted); margin-top: 4px; }
.lamppin { position: absolute; left: -9%; top: 58%; display: flex; align-items: center; gap: 4px; }
.lamppin i { width: 14px; height: 1px; background: var(--muted); }
.lamppin svg { width: 22px; height: 22px; fill: var(--inactive); stroke: var(--inactive); }
.lights-on .lamppin svg { fill: var(--ok); stroke: var(--ok); }
.homecards { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: grid; grid-template-columns: 340px 240px; gap: 10px; z-index: 6; }
#home .dots { position: absolute; left: 0; right: 0; bottom: 4px; }

/* ---------- Mapa ---------- */
#mapview { display: grid; grid-template-columns: 34% 1fr; }
.side { background: var(--panel); display: flex; flex-direction: column; padding: 12px 12px 10px; min-height: 0; transition: background .5s; z-index: 2; }
.side .head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; border-bottom: 1px solid var(--outline); }
.side .speed { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.side .body { flex: 1; position: relative; min-height: 0; }
.side .tells { position: absolute; left: 2px; top: 10px; }
.side .speedbig { position: absolute; right: 4px; top: 8px; text-align: right; }
.side .speedbig .n { font-size: 46px; font-weight: 300; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.side .speedbig .u { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
.topcar { position: absolute; left: 50%; top: 56%; height: 50%; aspect-ratio: 318 / 586; transform: translate(-50%, -50%); }
.topcar img, .topcar svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .6s; }
.topcar .lit { opacity: 0; }
.lights-on .topcar .lit.has { opacity: 1; }
.lights-on .topcar .base.swap { opacity: 0; }
.side .chips { display: flex; gap: 6px; justify-content: center; margin: 6px 0 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12px; font-weight: 600; color: #fff; }
.chip.bad { background: var(--bad); }
.chip.warn { background: var(--warn); }
.mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: #e9e9e9; }
:root[data-theme="dark"] #map { background: #1a1a1a; }
:root[data-theme="dark"] #map .maplibregl-canvas { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.92) saturate(.5); }
.maplibregl-ctrl-attrib { font-size: 9px; }
/* Leaflet heading-up: the map layer is bigger than the panel so the corners stay covered when it turns and tilts */
.mapwrap { overflow: hidden; }
#map.hup { inset: -115% -70%; transform-origin: 50% 50%; transition: transform .9s linear; will-change: transform; }
#map.hup .leaflet-marker-icon { transition: none; }
#arrow { transition: transform .9s linear; }
:root[data-theme="dark"] #map .leaflet-tile-pane { filter: brightness(1.15) contrast(1.05); }
.mapattr { position: absolute; right: 6px; bottom: 4px; z-index: 450; font-size: 9px; color: #757575; background: rgba(250,250,250,.75); padding: 0 4px; border-radius: 3px; pointer-events: none; }
.leaflet-container { font-family: var(--font); }
.leaflet-control-attribution { font-size: 9px; background: rgba(250,250,250,.8) !important; color: #757575 !important; }
.leaflet-control-attribution a { color: #757575 !important; }
.mapsearch { position: absolute; left: 12px; top: 12px; width: min(300px, calc(100% - 80px)); height: 46px; z-index: 500; display: flex; align-items: center; gap: 10px; padding: 0 14px;
  font-size: 15px; font-weight: 500; color: var(--muted); }
.mapsearch svg { width: 20px; height: 20px; fill: var(--muted); }
.mapctl { position: absolute; right: 12px; top: 12px; z-index: 500; display: flex; flex-direction: column; overflow: hidden; }
.mapctl button { width: 46px; height: 46px; display: grid; place-items: center; }
.mapctl button + button { border-top: 1px solid var(--outline); }
.mapctl svg { width: 22px; height: 22px; fill: var(--fg); }
.mapctl .follow svg { fill: var(--accent); }
.mapctl .off svg { fill: #e82127; }
.mapmsg { position: absolute; right: 74px; top: 44px; z-index: 500; padding: 10px 14px; font-size: 13px; color: var(--muted); }
.applaunch { position: absolute; inset: 0; z-index: 400; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--panel); }
.applaunch .go { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 8px; font-size: 18px; font-weight: 600; background: var(--fg); color: var(--panel); }
.applaunch .go svg { width: 22px; height: 22px; fill: var(--panel); }
.applaunch .alt { font-size: 14px; color: var(--muted); }

/* ---------- Drive view (Tesla FSD-style visualization) ---------- */
#drive { background: var(--dbg); }
#viz { position: absolute; inset: 0; width: 100%; height: 100%; }
.dcar { position: absolute; left: 50%; bottom: 25%; width: 168px; aspect-ratio: 318 / 396; transform: translateX(-50%); pointer-events: none; }
.dcar.chase { width: 138px; aspect-ratio: 384 / 626; bottom: 24%; }
.dcar img, .dcar svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .6s; }
.dcar .lit { opacity: 0; } .lights-on .dcar .lit { opacity: 1; } .lights-on .dcar .base.swap { opacity: 0; }
.dhud { position: absolute; left: 18px; top: 12px; display: flex; flex-direction: column; gap: 2px; z-index: 3; }
.dhud .trip, .dhud .u, .dhud .gear, .dhud .sp { text-shadow: 0 0 6px var(--dbg), 0 0 3px var(--dbg); }
.dhud .row1 { display: flex; align-items: center; gap: 10px; }
.dhud .ready { font-size: 12px; font-weight: 600; color: var(--ok); letter-spacing: .04em; }
.dhud .sp { font-size: 64px; font-weight: 400; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.dhud .sp.over { color: var(--bad); }
.s80 { color: #ff9500 !important; } .s100 { color: #ff3b30 !important; }
.dhud .u { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
.dhud .lim { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.dhud .limit { margin: 0; }
.dhud .tell svg { width: 24px; height: 24px; }
.dhud .trip { margin-top: 6px; }
.drivecards { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: grid; grid-template-columns: 330px 230px; gap: 10px; z-index: 5; }
#drive .card { background: var(--mcard); box-shadow: none; }
/* car marker on the maps */
.carmark { width: 34px; height: 62px; display: block; }
.tptr { display: block; width: 40px; height: 40px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
.carmark img, .carmark svg { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }


/* ---------- Tesla split layout: car / driving view on the left, the map always on the right ---------- */
.screen { --lw: 43%; }
#home, #drive { right: auto; width: var(--lw); transition: opacity .35s, width .45s; }
#mapview { left: var(--lw); display: block; transition: left .45s; }
#mapview .side { display: none; }
#mapview .mapwrap { position: absolute; inset: 0; }
.screen.mapfull #mapview { left: 0; }
.screen.mapfull #home, .screen.mapfull #drive { opacity: 0; pointer-events: none; }
.stage { width: 88%; top: 47%; }
.homecards, .drivecards { grid-template-columns: minmax(0, 360px); }
#navHome, #navDrive { display: none; }
.statusbar .mid { gap: 14px; }
.callout.trunk { left: 90%; }
.mtop { position: absolute; right: 74px; top: 14px; z-index: 450; display: flex; gap: 14px; font-size: 15px; font-weight: 600;
  color: var(--fg); text-shadow: 0 0 6px var(--panel), 0 0 2px var(--panel); font-variant-numeric: tabular-nums; pointer-events: none; }
#map.sat .maplibregl-canvas, #map.sat .leaflet-tile-pane { filter: none !important; }
:root[data-theme="dark"] #map.sat .maplibregl-canvas { filter: brightness(.8) !important; }

/* navigation panel */
.navpanel { position: absolute; left: 12px; top: 12px; width: min(300px, calc(100% - 84px)); z-index: 520; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100% - 24px); }
.navpanel .q { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 14px; flex: none; }
.navpanel .q > svg { width: 20px; height: 20px; fill: var(--muted); flex: none; }
.navpanel input { flex: 1; min-width: 0; height: 40px; border: 0; outline: 0; background: none; font: 500 15px var(--font); color: var(--fg); }
.navpanel input::placeholder { color: var(--muted); }
.navpanel input::-webkit-search-cancel-button { display: none; }
.navpanel .qx { width: 34px; height: 34px; display: grid; place-items: center; }
.navpanel .qx svg { width: 18px; height: 18px; fill: var(--muted); }
.navpanel .more { border-top: 1px solid var(--outline); display: flex; flex-direction: column; min-height: 0; }
.navpanel.min .more { display: none; }
.places2 { display: grid; grid-template-columns: 1fr 1fr; flex: none; }
.places2 button { height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--fg); }
.places2 button + button { border-left: 1px solid var(--outline); }
.places2 svg { width: 17px; height: 17px; fill: var(--fg); }
.places2 button:active, .navpanel .row:active { background: var(--outline); }
.tabs { padding: 10px 16px 4px; font-size: 13px; font-weight: 600; color: var(--fg); border-top: 1px solid var(--outline); flex: none; }
.navpanel .list { overflow-y: auto; min-height: 0; padding-bottom: 6px; }
.navpanel .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 9px 16px; cursor: pointer; }
.navpanel .row b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navpanel .row span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navpanel .row i { font-style: normal; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.navpanel .row i svg { width: 18px; height: 18px; fill: var(--muted); }
.navpanel .empty { padding: 10px 16px 14px; font-size: 12px; color: var(--muted); }

/* turn card (white Tesla card over the map) */
.maneuver { position: absolute; left: 12px; top: 12px; z-index: 530; width: min(330px, calc(100% - 84px)); border-radius: 8px; overflow: hidden;
  background: var(--panel); color: var(--fg); box-shadow: var(--shadow); display: grid; grid-template-columns: 64px 1fr; }
.maneuver .ico { grid-row: 1; width: 64px; display: grid; place-items: center; background: var(--fg); }
.maneuver .ico svg, .maneuver .ico img { width: 40px; height: 40px; fill: var(--panel); object-fit: contain; }
.maneuver .mt { padding: 10px 14px; min-width: 0; }
.maneuver .d { font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.maneuver .t { font-size: 14px; font-weight: 500; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.maneuver .src { font-size: 10px; color: var(--muted); margin-top: 2px; }
.maneuver .next { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--outline); }
.maneuver .next svg { width: 16px; height: 16px; fill: var(--muted); }
.navon .navpanel { display: none; }

/* arrival card */
.eta { position: absolute; left: 12px; bottom: 12px; z-index: 520; width: min(330px, calc(100% - 84px)); padding: 12px 14px 0; }
.eta1 { display: flex; align-items: baseline; gap: 8px; }
.eta1 b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.eta1 span, .eta2 { font-size: 13px; color: var(--muted); }
.eta2 { display: flex; gap: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.etabar { height: 4px; border-radius: 2px; background: var(--outline); margin: 10px 0 0; overflow: hidden; }
.etabar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .8s; }
.etabtn { display: grid; grid-template-columns: 1fr 1fr; margin: 8px -14px 0; border-top: 1px solid var(--outline); }
.etabtn button { height: 44px; font-size: 14px; font-weight: 600; color: var(--muted); }
.etabtn button.end { color: var(--bad); border-left: 1px solid var(--outline); }
.etabtn button:active { background: var(--outline); }
.turnmark { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); border: 2px solid #1f47b8; }
.turnmark svg { width: 20px; height: 20px; fill: #1f47b8; }
.maneuver { cursor: pointer; }
.maneuver .tlist { grid-column: 1 / -1; display: none; max-height: 240px; overflow-y: auto; border-top: 1px solid var(--outline); }
.maneuver.open .tlist { display: block; }
.maneuver .trow { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; font-size: 13px; border-bottom: 1px solid var(--outline); }
.maneuver .trow svg { width: 20px; height: 20px; fill: var(--fg); }
.maneuver .trow b { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dturn { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 10px 6px 6px; border-radius: 8px; background: var(--mcard); max-width: 230px; }
.dturn > span { width: 30px; height: 30px; display: grid; place-items: center; }
.dturn svg, .dturn img { width: 26px; height: 26px; fill: var(--fg); object-fit: contain; }
.dturn b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dturn div span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
/* destination pin */
.destpin { width: 30px; height: 40px; }
.destpin svg { width: 30px; height: 40px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }

/* ---------- Bottom bar: white by day, black by night; monochrome icons ---------- */
.bar { background: var(--barbg); border-top: 1px solid var(--outline); display: grid; grid-template-columns: 74px 120px 1fr 120px 150px; align-items: center; color: var(--fg); transition: background .5s; }
.bar .carbtn { display: grid; place-items: center; height: 66px; }
.bar .carbtn svg { width: 30px; height: 30px; fill: var(--fg); }
.temp { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 24px; font-weight: 400; font-variant-numeric: tabular-nums; }
.temp button, .volc button { width: 30px; height: 50px; display: grid; place-items: center; }
.temp svg, .volc .chev svg { width: 14px; height: 14px; fill: var(--inactive); }
.temp span { min-width: 44px; text-align: center; }
.bar .apps { display: flex; justify-content: center; gap: 26px; }
.app-i { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; transition: transform .12s, background .12s; }
.app-i:active { transform: scale(.88); background: var(--outline); }
.app-i svg { width: 28px; height: 28px; fill: var(--fg); }
.volc { display: flex; align-items: center; justify-content: center; gap: 2px; }
.volc .lvl { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); min-width: 54px; justify-content: center; font-variant-numeric: tabular-nums; }
.volc .lvl svg { width: 26px; height: 26px; fill: var(--fg); }

/* ---------- 360° car ---------- */
.stage.spin { cursor: grab; touch-action: none; }
.stage .callout, .stage .lockpin, .stage .lamppin { transition: opacity .3s; }
.stage.turned .callout, .stage.turned .lockpin, .stage.turned .lamppin { opacity: 0; pointer-events: none; }
.spinhint { position: absolute; left: 50%; bottom: -2%; transform: translateX(-50%); font-size: 11px; color: var(--inactive); letter-spacing: .04em; white-space: nowrap; transition: opacity .6s; }

/* ---------- Driving view: parked = car from above; in motion the camera swings behind the car ---------- */
.side .body { perspective: 520px; perspective-origin: 50% 30%; }
.road { transition: transform 1.3s cubic-bezier(.4,0,.2,1), width 1.3s; transform-origin: 50% 100%; }
.side.driving .road { transform: translateX(-50%) rotateX(62deg); width: 70%; }
.topcar { transition: opacity .7s, transform 1.3s cubic-bezier(.4,0,.2,1); }
.side.driving .topcar { opacity: 0; transform: translate(-50%, -30%) rotateX(60deg) scale(.8); }
.rearcar { position: absolute; left: 50%; bottom: 4%; width: 46%; aspect-ratio: 318 / 396; transform: translateX(-50%) scale(1.25) rotateY(25deg);
  opacity: 0; transition: opacity .9s .35s, transform 1.3s cubic-bezier(.4,0,.2,1); pointer-events: none; }
.side.driving .rearcar { opacity: 1; transform: translateX(-50%) scale(1) rotateY(0); }
.rearcar img, .rearcar svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .6s; }
.rearcar .lit { opacity: 0; } .lights-on .rearcar .lit { opacity: 1; } .lights-on .rearcar .base.swap { opacity: 0; }
.limit { margin: 6px 0 0 auto; width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 5px solid #e5322c; display: grid; place-items: center;
  font-size: 15px; font-weight: 700; color: #171717; font-variant-numeric: tabular-nums; }
.speedbig.over .n { color: var(--bad); }
.trip { font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.side .speedbig { z-index: 3; }

.road { position: absolute; left: 50%; top: 0; bottom: 0; width: 54%; transform: translateX(-50%); background: var(--road);
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); }
.road i { position: absolute; top: 0; bottom: 0; width: 3px; background-image: repeating-linear-gradient(to bottom, var(--lane) 0 26px, transparent 26px 56px); background-position-y: var(--off, 0px); }
.road i.l1 { left: 33%; } .road i.l2 { left: 67%; }
.road b { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--lane); opacity: .7; }
.road b.e1 { left: 2%; } .road b.e2 { right: 2%; }
@media (max-width: 900px) {
  .bar { grid-template-columns: 60px 100px 1fr 100px 130px; }
  .bar .apps { gap: 10px; }
  .homecards { grid-template-columns: 300px 210px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  if (on) say('Indicaciones por voz activadas');
};
paintVoice();
// Tap: say where to go ("llévame a la Calle 72 con 46", "a casa"). Hold: open Gemini / the phone's assistant.
longPress($('micBtn'), function () {
  try { if (Car.listen) { Car.listen(); return; } } catch (e) {}
  toast('El dictado por voz no está disponible en este radio');
}, function () { try { if (Car.assistant) Car.assistant(); } catch (e) {} });
window.onVoice = function (text) {
  var t = String(text || '').trim();
  if (!t) return;
  var q = t.replace(/^(ok(ey)?\s+)?(por favor\s+)?(ll[eé]vame|ll[eé]vanos|vamos|ir|navega|navegar|quiero ir|c[oó]mo llego|ruta|dime c[oó]mo llegar)(\s+(hasta|hacia|para|a|al|a la))?\s+/i, '').replace(/[.!?¿¡]+$/, '').trim();
  var low = q.toLowerCase();
  if (/^(mi\s+)?casa$/.test(low)) { goPlace('home'); return; }
  if (/^(el\s+|mi\s+)?(trabajo|oficina)$/.test(low)) { goPlace('work'); return; }
  toast('Buscando “' + q + '”…');
  $('navpanel').classList.remove('min'); $('q').value = q; $('qx').hidden = false;
  showList([], 'Buscando…', 'Buscando “' + esc(q) + '”…');
  placeSearch(q).then(function (r) {
    showList(r, 'Resultados', 'No encontré “' + esc(q) + '”. Prueba de nuevo o escríbelo.');
    if (r.length) pick(r[0]); else say('No encontré ' + q);
  }).catch(function () { showList([], 'Resultados', 'Sin internet: no se puede buscar'); });
};

// --- satellite ---
var sat = store.get('sat', '0') === '1';
function applySat() {
  $('map').classList.toggle('sat', sat);
  $('satBtn').classList.toggle('follow', sat);
  if (ml && mlReady) {
    if (sat && !ml.getLayer('sat')) {
      if (!ml.getSource('sat')) ml.addSource('sat', { type: 'raster', tileSize: 256, maxzoom: 19, attribution: 'Imágenes © Esri',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] });
      var first = null; ml.getStyle().layers.some(function (l) { if (l.type === 'symbol' || l.id === 'route-case') { first = l.id; return true; } return false; });
      ml.addLayer({ id: 'sat', type: 'raster', source: 'sat' }, first || undefined);
    } else if (!sat && ml.getLayer('sat')) ml.removeLayer('sat');
  } else if (map && tiles) {
    tiles.setUrl(baseTiles());
    if (sat) headUp(false);
  }
}
$('satBtn').onclick = function () { sat = !sat; store.set('sat', sat ? '1' : '0'); applySat(); };

// --- instructions ---
var TURN = {
  right: 'M6 20h2v-7h8.17l-2.58 2.59L15 17l5-5-5-5-1.41 1.41L16.17 11H8a2 2 0 0 0-2 2v7z',
  left: 'M18 20h-2v-7H7.83l2.58 2.59L9 17l-5-5 5-5 1.41 1.41L7.83 11H16a2 2 0 0 1 2 2v7z',
  straight: 'M11 20h2V7.83l3.59 3.58L18 10l-6-6-6 6 1.41 1.41L11 7.83z',
  uturn: 'M17 20h2V9a5 5 0 0 0-10 0v4.17l-2.59-2.58L5 12l5 5 5-5-1.41-1.41L11 13.17V9a3 3 0 0 1 6 0v11z',
  round: 'M12 5a7 7 0 0 0-1 13.93V22h2v-3.07A7 7 0 0 0 12 5zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zM11 1h2v5h-2z',
  flag: 'M14.4 6 14 4H5v17h2v-7h5.6l.4 2h7V6z'
};
var ORD = ['', 'primera', 'segunda', 'tercera', 'cuarta', 'quinta', 'sexta'];
function stepText(st) {
  var dir = { right: 'a la derecha', left: 'a la izquierda', 'slight right': 'levemente a la derecha', 'slight left': 'levemente a la izquierda',
    'sharp right': 'cerrado a la derecha', 'sharp left': 'cerrado a la izquierda', straight: 'derecho', uturn: 'en U' }[st.mod] || '';
  var onto = st.name ? ' hacia ' + st.name : '';
  switch (st.type) {
    case 'arrive': return 'Llegas a ' + nav.label;
    case 'roundabout': case 'rotary': case 'roundabout turn': return 'En la glorieta toma la ' + (ORD[st.exit] || '') + ' salida' + onto;
    case 'merge': return 'Incorpórate ' + dir + onto;
    case 'fork': return 'Mantente ' + dir + onto;
    case 'on ramp': case 'off ramp': return 'Toma la salida ' + dir + onto;
    case 'continue': case 'new name': return 'Sigue ' + (dir === 'derecho' || !dir ? 'derecho' : dir) + onto;
    case 'end of road': return 'Al final de la vía gira ' + dir + onto;
    default: return (st.mod === 'uturn' ? 'Haz un giro en U' : st.mod === 'straight' ? 'Sigue derecho' : 'Gira ' + dir) + onto;
  }
}
function stepIcon(st) {
  var k = st.type === 'arrive' ? 'flag' : /round|rotary/.test(st.type) ? 'round' : st.mod.indexOf('right') >= 0 ? 'right' : st.mod.indexOf('left') >= 0 ? 'left' : st.mod === 'uturn' ? 'uturn' : 'straight';
  return '<svg viewBox="0 0 24 24"><path d="' + TURN[k] + '"/></svg>';
}
function fmtDist(km) { return km >= 1 ? km.toFixed(1).replace('.', ',') + ' km' : (Math.round(km * 1000 / 10) * 10) + ' m'; }
function spokenDist(m) { return m >= 1000 ? (m >= 1500 ? (Math.round(m / 500) / 2).toString().replace('.', ',') + ' kilómetros' : 'un kilómetro') : (Math.round(m / 50) * 50) + ' metros'; }
function nearestOnRoute(p) {
  if (world.lat0) { // projection on the route segments (metres), so the remaining distance is exact
    routeLocal();
    var q = toLocal(p[1], p[0]), sn = routeMatch(world.routeRaw, q[0], q[1], pose.ok ? pose.fh : null, matchNav);
    return { d: sn.d / 1000, i: sn.i, km: nav.cum[sn.i - 1] + sn.t / 1000 };
  }
  var best = 1e9, bi = 0;
  for (var i = 0; i < nav.route.length; i++) { var d = hav(p, [nav.route[i][1], nav.route[i][0]]); if (d < best) { best = d; bi = i; } }
  return { d: best, i: bi, km: nav.cum[bi] };
}
function clock(t) { var d = new Date(t), h = d.getHours(), ap = h < 12 ? 'a. m.' : 'p. m.'; h = h % 12 || 12; return h + ':' + pad(d.getMinutes()) + ' ' + ap; }
// Small next-turn chip next to the speed in the drive view (like Tesla's visualization)
function setChip(ico, dist, name) {
  $('dturn').hidden = false; $('dtIco').innerHTML = ico; $('dtDist').textContent = dist; $('dtName').textContent = name;
}
// Tap the turn card: list of the remaining turns
function turnList(p) {
  var html = '', acc = hav(p, [nav.steps[nav.idx].loc[1], nav.steps[nav.idx].loc[0]]);
  for (var i = nav.idx + 1; i < nav.steps.length && i < nav.idx + 8; i++) {
    var a = nav.steps[i - 1].loc, b = nav.steps[i].loc; acc += hav([a[1], a[0]], [b[1], b[0]]);
    html += '<div class="trow">' + stepIcon(nav.steps[i]) + '<span>' + esc(stepText(nav.steps[i])) + '</span><b>' + fmtDist(acc) + '</b></div>';
  }
  $('mList').innerHTML = html || '<div class="trow"><span>Sin más giros</span></div>';
}
$('maneuver').onclick = function () { if (!nav.route) return; this.classList.toggle('open'); if (this.classList.contains('open')) turnList(myPos()); };
var navIconId = null;
function updateNav(s) {
  var box = $('maneuver');
  // 1) Our own route has priority; 2) otherwise the Waze / Google Maps instructions (from their notification).
  if (!nav.route && s.nav && s.nav.active) {
    box.hidden = false; $('mapwrapEl').classList.add('navon');
    $('mDist').textContent = s.nav.title || '';
    $('mText').textContent = s.nav.text || '';
    $('mSrc').textContent = 'Indicaciones de ' + (s.nav.app || 'la app de mapas');
    $('mNext').hidden = true;
    setChip($('mIco').innerHTML, s.nav.title || '', s.nav.text || '');
    if (s.nav.iconId !== navIconId) {
      navIconId = s.nav.iconId;
      var ic = s.nav.iconId ? Car.navIcon() : '';
      $('mIco').innerHTML = ic ? '<img alt="" src="' + ic + '">' : stepIcon({ type: '', mod: 'straight' });
    }
    return;
  }
  navIconId = null;
  if (!nav.route) { box.hidden = true; $('mapwrapEl').classList.remove('navon'); $('dturn').hidden = true; return; }
  if (!s.fix) return;
  var p = [s.lat, s.lon];
  if (hav(p, [nav.dest[1], nav.dest[0]]) < 0.04) { say('Llegaste a tu destino, ' + nav.label); toast('Llegaste a ' + nav.label); endNav(); return; }
  var st = nav.steps[nav.idx];
  while (st && st.type !== 'arrive' && hav(p, [st.loc[1], st.loc[0]]) < 0.025 && nav.idx < nav.steps.length - 1) { nav.idx++; st = nav.steps[nav.idx]; }
  if (!st) { box.hidden = true; return; }
  var near = nearestOnRoute(p);
  // a manoeuvre already left behind on the route (e.g. the U-turn just done) gives way to the next one
  while (st && st.type !== 'arrive' && near.d < 0.05 && st.km != null && st.km < near.km - 0.03 && nav.idx < nav.steps.length - 1) { nav.idx++; st = nav.steps[nav.idx]; }
  // the part already driven disappears from the map
  if (near.i !== nav.cut && near.d < 0.05) {
    nav.cut = near.i;
    var gjc = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: routeCoords() } };
    if (ml && mlReady && ml.getSource('route')) ml.getSource('route').setData(gjc);
    else if (map && nav.layer) { nav.layer.clearLayers(); nav.layer.addData(gjc); }
  }
  if (turnIdx !== nav.idx) drawTurnMark();
  // Off the route for 8 s: recalculate (at most every 25 s).
  if (near.d > 0.07) { if (!nav.offSince) nav.offSince = Date.now(); } else nav.offSince = 0;
  if (nav.offSince && Date.now() - nav.offSince > 8000 && Date.now() - nav.lastRoute > 25000) { say('Recalculando'); nav.said = {}; fetchRoute(); }
  var dKm = hav(p, [st.loc[1], st.loc[0]]), dM = dKm * 1000, txt = stepText(st);
  box.hidden = false;
  $('mDist').textContent = fmtDist(dKm);
  $('mText').textContent = txt;
  $('mSrc').textContent = '';
  $('mIco').innerHTML = stepIcon(st);
  var nx = nav.steps[nav.idx + 1];
  $('mNext').hidden = !nx;
  if (nx) $('mNext').innerHTML = 'Luego ' + stepIcon(nx) + '<span>' + esc(stepText(nx)) + '</span>';
  if ($('maneuver').classList.contains('open')) turnList(p);
  setChip(stepIcon(st), fmtDist(dKm), st.name || txt);
  // trip summary
  var left = Math.max(0, nav.total - near.km), secs = nav.total ? nav.dur * left / nav.total : 0;
  $('etaTime').textContent = clock(Date.now() + secs * 1000);
  $('etaMin').textContent = secs >= 3600 ? Math.floor(secs / 3600) + ' h ' + Math.round(secs % 3600 / 60) + ' min' : Math.max(1, Math.round(secs / 60)) + ' min';
  $('etaKm').textContent = fmtDist(left);
  $('etaBar').style.width = (nav.total ? Math.min(100, (1 - left / nav.total) * 100) : 0) + '%';
  // Voice guidance: once at the start, ~400 m before the turn and again right before it.
  if (!nav.startSaid) { nav.startSaid = true; say('Iniciando ruta a ' + nav.label + '. ' + (dM > 80 ? 'En ' + spokenDist(dM) + ', ' : '') + txt.charAt(0).toLowerCase() + txt.slice(1)); nav.said[nav.idx + 'a'] = 1; }
  var key = nav.idx;
  if (dM <= 450 && dM > 150 && !nav.said[key + 'a']) { nav.said[key + 'a'] = 1; say('En ' + spokenDist(dM) + ', ' + txt.charAt(0).toLowerCase() + txt.slice(1)); }
  if (dM <= 70 && !nav.said[key + 'b'] && st.type !== 'arrive') { nav.said[key + 'b'] = 1; nav.said[key + 'a'] = 1; say(txt); }
}
showRecents();
setTimeout(ensureMap, 50);

// ---------- Render ----------
var artId = null, drivingSince = 0, stoppedSince = Date.now();
function pad(n) { return String(n).padStart(2, '0'); }
function fmtKm(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function mmss(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + pad(s % 60); }
var lastState = null;
function render(s) {
  lastState = s;
  var root = document.documentElement, theme = s.night ? 'dark' : 'light';
  if (root.dataset.theme !== theme) root.dataset.theme = theme;
  setMapTheme(theme === 'dark');
  document.body.classList.toggle('lights-on', !!s.lights);
  if (spin && lit !== !!s.lights) { lit = !!s.lights; showFrame(frame); }
  if (litNow !== !!s.lights) { litNow = !!s.lights; refreshCarMark(); }

  if (carV !== (s.carV || '')) {
    carV = s.carV || '';
    if (!spin) {
      var b = setCar($('carHome'), 'base', 'lit', 'genericSide');
      $('mirror').innerHTML = b ? '<img alt="" src="' + b + '">' : $('genericSide').innerHTML;
    }
    setCar($('carTop'), 'top', 'toplit', 'genericTop');
    if (carV) carPics(); // a new car package was imported
  }
  if (s.mapMode !== mapMode) { mapMode = s.mapMode || 'map'; $('appLaunch').hidden = mapMode !== 'app'; }
  $('appGoText').textContent = s.mapsLabel ? 'Abrir ' + s.mapsLabel : 'Elegir app de mapas';
  $('etaWaze').textContent = 'Abrir en ' + (s.mapsLabel || 'Waze');

  var d = new Date();
  $('time1').textContent = d.getHours() + ':' + pad(d.getMinutes());
  $('temp1').textContent = s.wx ? s.wx.temp + '°C' : '--°C';
  $('name').textContent = s.name || 'Conductor';

  // Gear from GPS speed (simulated: the radio does not read the gearbox).
  var sp = s.fix ? Math.max(0, Math.round(s.speed)) : 0;
  var gear = sp >= 3 ? 'D' : 'P';
  ['gear1', 'gear2'].forEach(function (id) {
    $(id).innerHTML = 'PRND'.split('').map(function (g) { return g === gear ? '<b>' + g + '</b>' : '<span>' + g + '</span>'; }).join('');
  });
  $('speed').textContent = sp;
  roadSpeed = sp;
  // Auto view: as soon as the car moves (GPS), go to the driving view, unless the user just chose a view.
  if (sp >= 5) { if (!drivingSince) drivingSince = Date.now(); stoppedSince = 0; } else { drivingSince = 0; if (!stoppedSince) stoppedSince = Date.now(); }
  if (Date.now() > manualUntil && drivingSince && Date.now() - drivingSince > 1500 && view === 'home') showView('drive', true);
  if (Date.now() > manualUntil && view === 'drive' && stoppedSince && Date.now() - stoppedSince > 90000) showView('home', true);
  // Camera behind the car while moving; back to the view from above after 8 s stopped.
  var side = document.querySelector('.side');
  if (drivingSince && Date.now() - drivingSince > 800) side.classList.add('driving');
  else if (stoppedSince && Date.now() - stoppedSince > 8000) side.classList.remove('driving');
  updateTrip(s, sp);
  updateLimit(s, sp);

  var oilTxt = !s.oil.configured ? 'Aceite: configurar' : s.oil.left < 0 ? '¡Cambio de aceite!' : fmtKm(s.oil.left) + ' km';
  $('oil1').querySelector('span').textContent = oilTxt;
  $('oil2').textContent = s.oil.configured && s.oil.left >= 0 ? 'Aceite · ' + oilTxt : oilTxt;
  $('oilWarn').hidden = !(s.oil.configured && (s.oil.warn || s.oil.left < 0));
  $('oilWarn').textContent = s.oil.left < 0 ? '¡Cambio de aceite!' : 'Aceite: ' + fmtKm(s.oil.left) + ' km';
  var pico = s.pico && s.pico.show;
  $('pico1').hidden = !pico; $('pico2').hidden = !pico;
  if (pico && s.pico.label && s.pico.label !== 'pico y placa') { $('pico1').textContent = s.pico.label.toUpperCase(); $('pico2').textContent = s.pico.label; }
  if (pico) $('pico2').textContent = s.pico.text || 'Pico y placa hoy';

  var m = s.media || {};
  document.querySelectorAll('.music').forEach(function (c) {
    c.querySelector('.title').textContent = m.title || (m.access ? 'Nada sonando' : 'Ver la música aquí');
    c.querySelector('.artist span').textContent = m.title ? (m.artist || m.src || '') : (m.access ? 'Toca para abrir la música' : 'Permite el acceso a notificaciones');
    c.querySelector('.src').textContent = m.dur ? mmss(m.pos || 0) : '';
    c.querySelector('.pp').setAttribute('d', m.playing ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z');
    c.querySelector('.bar i').style.width = m.dur ? Math.min(100, (m.pos || 0) / m.dur * 100) + '%' : '0';
  });
  if (m.artId !== artId) {
    artId = m.artId;
    var url = artId ? Car.art() : '';
    document.querySelectorAll('.music .art').forEach(function (a) { a.style.backgroundImage = url ? 'url(' + url + ')' : ''; a.classList.toggle('has', !!url); });
  }
  $('vol').textContent = s.vol >= 0 ? s.vol : '–';
  updateDrive(s, sp);
  updateMap(s);
  updateNav(s);
}
function tick() { try { render(JSON.parse(Car.state())); } catch (e) {} }

// ---------- Bar ----------
function longPress(el, onTap, onLong) {
  var timer = null, longDone = false;
  function start() { longDone = false; timer = setTimeout(function () { longDone = true; onLong(); }, 600); }
  function stop() { clearTimeout(timer); }
  ['touchstart', 'mousedown'].forEach(function (ev) { el.addEventListener(ev, start, { passive: true }); });
  ['touchend', 'touchcancel', 'touchmove', 'mouseup', 'mouseleave'].forEach(function (ev) { el.addEventListener(ev, stop, { passive: true }); });
  el.oncontextmenu = function (e) { e.preventDefault(); };
  el.onclick = function () { if (longDone) { longDone = false; return; } onTap(); };
}
document.querySelectorAll('[data-slot]').forEach(function (b) {
  longPress(b, function () { Car.open(b.dataset.slot); }, function () { act('pick:' + b.dataset.slot); });
});
$('bCar').onclick = function () { act('settings'); };
$('bApps').onclick = function () { act('apps'); };
$('bOff').onclick = function () { act('screenoff'); };
$('vUp').onclick = function () { act('volup'); };
$('vDown').onclick = function () { act('voldown'); };
$('profile').onclick = function () { act('settings'); };
$('pico1').onclick = function () { act('settings'); };

if (location.hash.indexOf('mapa') >= 0) showView('map');
tick();
setInterval(tick, 1000);
</script>
